name: Release checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plainsolid-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: kernel-pin
        run: node -p '"go-version=" + require("./scripts/plainsolid-pin.json").go' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.kernel-pin.outputs.go-version }}
          cache: false
      - run: npm run kernel:plainsolid
      - uses: actions/upload-artifact@v4
        with:
          name: plainsolid-kernel
          path: |
            src/cad/kernel/plainsolid-kernel.wasm
            src/cad/kernel/plainsolid-kernel.json
            src/cad/kernel/plainsolid-NOTICE.txt
            src/cad/kernel/wasm_exec.js
          if-no-files-found: error
          retention-days: 7

  check:
    needs: plainsolid-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plainsolid-kernel
          path: src/cad/kernel
      - run: npx playwright install --with-deps chromium
      - run: npm run lint && npm test && npm run test:plainsolid && npm run build
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-results
          path: test-results/
          retention-days: 7

  chromium-modeling:
    needs: plainsolid-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plainsolid-kernel
          path: src/cad/kernel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-modeling-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  ai-cross-browser:
    needs: plainsolid-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plainsolid-kernel
          path: src/cad/kernel
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run --auto-servernum npm run test:ai:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-cross-browser-${{ matrix.browser }}
          path: test-results/ai-cross-browser/
          retention-days: 7

  workbench-cross-browser:
    needs: plainsolid-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plainsolid-kernel
          path: src/cad/kernel
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum npm run test:cross-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-cross-browser-results
          path: test-results/cross-browser/
          retention-days: 7
