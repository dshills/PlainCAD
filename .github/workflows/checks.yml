name: Release checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

  ai-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:ai:browser -- --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-cross-browser-results
          path: test-results/ai-cross-browser/
          retention-days: 7

  workbench-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:cross-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-cross-browser-results
          path: test-results/cross-browser/
          retention-days: 7
